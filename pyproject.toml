[project]
name = "prospero-job-agent"
version = "0.1.0"
description = "A focused personal job-search agent MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "pypdf>=5,<7",
    "pyyaml>=6,<7",
    "sqlmodel>=0.0.22,<0.1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
