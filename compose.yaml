services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prospero
      POSTGRES_USER: prospero
      POSTGRES_PASSWORD: prospero
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospero"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://prospero:prospero@db:5432/prospero
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "9080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://prospero:prospero@db:5432/prospero
      CANDIDATE_PROFILE_PATH: config/candidate_profile.yaml
      PDF_RESUMES_PATH: data/resumes
      PDF_VACANCIES_PATH: data/vacancies
      CATEGORY_TAXONOMY_PATH: config/categories.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      HH_USER_AGENT: ${HH_USER_AGENT:-ProsperoJobAgent/0.1}
      HH_ACCESS_TOKEN: ${HH_ACCESS_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_STYLE: ${LLM_API_STYLE:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
